<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Mis clientes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#00a884">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Clientes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root { --g:#00a884; --bg:#f0f2f5; --card:#fff; --tx:#111b21; --mu:#667781; --bd:#d1d7db; --err:#c0392b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b141a; --card:#202c33; --tx:#e9edef; --mu:#8696a0; --bd:#2a3942; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; font:16px/1.4 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--tx);
           padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    header { position:sticky; top:0; z-index:5; background:var(--g); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:8px; }
    header h1 { flex:1; margin:0; font-size:18px; }
    header button { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:16px; }
    main { padding:12px 16px 90px; max-width:560px; margin:0 auto; }
    input, textarea, select { width:100%; padding:12px; font-size:16px; /* 16px evita el zoom automático de iOS */
                      border:1px solid var(--bd); border-radius:10px; background:var(--card); color:var(--tx); font-family:inherit; }
    .card { background:var(--card); border-radius:12px; padding:12px 14px; margin:8px 0; display:flex; align-items:center; gap:10px; cursor:pointer; }
    .card .n { flex:1; min-width:0; } .card b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card small { color:var(--mu); }
    .pill { font-size:12px; padding:3px 9px; border-radius:12px; background:var(--g); color:#fff; white-space:nowrap; }
    .pill.none { background:var(--bd); color:var(--mu); }
    .fab { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:28px;
           border:0; background:var(--g); color:#fff; font-size:30px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
    .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; display:none; }
    .sheet { position:absolute; left:0; right:0; bottom:0; background:var(--bg); border-radius:18px 18px 0 0;
             padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; }
    .sheet h2 { margin:0 0 2px; font-size:19px; } .sheet .ph { color:var(--mu); margin-bottom:10px; }
    .acts { display:flex; gap:8px; margin:10px 0; }
    .acts a { flex:1; text-align:center; padding:12px; border-radius:10px; background:var(--card); color:var(--tx); text-decoration:none; font-weight:600; }
    .stages { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
    .stages button { padding:16px 8px; font-size:16px; font-weight:600; border-radius:12px; border:2px solid var(--bd); background:var(--card); color:var(--tx); }
    .stages button.on { border-color:var(--g); background:var(--g); color:#fff; }
    .btn { width:100%; padding:14px; border:0; border-radius:10px; background:var(--g); color:#fff; font-size:16px; font-weight:600; margin-top:8px; }
    .btn.sec { background:var(--card); color:var(--tx); }
    .login { max-width:360px; margin:18vh auto 0; padding:0 16px; text-align:center; }
    .login p { color:var(--mu); }
    #toast { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#222; color:#fff;
             padding:10px 16px; border-radius:20px; z-index:20; display:none; max-width:90%; }
    #toast.err { background:var(--err); }
    .tabs { display:flex; gap:6px; margin:6px 0 10px; overflow-x:auto; } .tabs button { flex:1; padding:10px 6px; border-radius:10px; border:2px solid var(--bd); background:var(--card); color:var(--tx); font-size:15px; font-weight:600; }
    .tabs button.on { border-color:var(--g); background:var(--g); color:#fff; }
    .call { font-size:18px; }
    .lbl { color:var(--mu); font-size:13px; margin:10px 0 4px; }
    .note { background:var(--card); border-radius:10px; padding:8px 10px; margin:6px 0; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .note small { display:block; color:var(--mu); margin-bottom:2px; }
    .note.call { border-left:4px solid var(--g); }
    select { width:100%; padding:12px; font-size:16px; border:1px solid var(--bd); border-radius:10px; background:var(--card); color:var(--tx); }
    .empty { text-align:center; color:var(--mu); margin-top:48px; }
    .fubar { background:#c0392b; color:#fff; border-radius:10px; padding:10px 12px; margin:8px 0; font-weight:600; cursor:pointer; }
    .fubar.ok { background:var(--card); color:var(--mu); font-weight:400; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; } .chips button { padding:12px 14px; border-radius:12px; border:2px solid var(--bd); background:var(--card); color:var(--tx); font-size:15px; font-weight:600; }
    .chips button.on { border-color:var(--g); background:var(--g); color:#fff; }
    .card.due { border-left:5px solid var(--err); } .hint { color:var(--mu); font-size:13px; margin:6px 0; }
    .banner { background:#fff3cd; color:#664d03; border-radius:10px; padding:8px 12px; margin:8px 0; font-size:14px; display:none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast"></div>
  <script src="followups.js"></script>
  <script src="supervisor.js"></script>
  <script src="app.js"></script>
</body>
</html>
